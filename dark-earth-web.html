<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DARK EARTH – Web Prototype</title>
<style>
:root{--bg:#0b0d14;--ink:#fff;--panel:rgba(0,0,0,.78);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05060a;--ink:#fff}}
:root[data-theme="dark"]{--bg:#05060a;--ink:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
#g{position:relative;height:100%;overflow:hidden;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.t{position:absolute;font-weight:700;text-shadow:0 0 4px #000,0 0 2px #000;pointer-events:none;font-size:clamp(14px,3.4vmin,26px)}
#sc{left:12px;top:10px}#am{left:12px;top:calc(10px + 4.4vmin + 6px)}#wv{right:12px;top:10px;text-align:right}
#st{left:10%;right:10%;top:calc(10px + 9vmin + 10px);text-align:center}
#en{left:0;right:0;top:calc(10px + 9vmin + 52px);text-align:center;font-size:clamp(11px,2.4vmin,18px);opacity:.85;pointer-events:auto;background:none;border:0;color:var(--ink);cursor:pointer;width:max-content;margin:auto}
#hb{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));width:min(60vw,320px);height:22px;background:rgba(0,0,0,.6);border-radius:6px;overflow:hidden}
#hf{height:100%;width:100%;background:#d92626}#ht{position:absolute;inset:0;text-align:center;font:700 14px/22px system-ui;text-shadow:0 0 3px #000}
button.b{position:absolute;border:0;color:#fff;font:800 clamp(16px,4vmin,28px) system-ui;border-radius:18px;opacity:.9;touch-action:none;cursor:pointer}
button.b:active{transform:scale(.95)}
#fire{right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(34vmin,170px);height:min(34vmin,170px);border-radius:50%;background:#cc1a1a;font-size:clamp(20px,5vmin,34px)}
#rel{left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(28vmin,140px);height:min(18vmin,90px);background:#2659bf}
#hunt{left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(32vmin,160px);height:min(18vmin,90px);background:#1a9933}
#fl{position:absolute;inset:0;background:#f00;opacity:0;pointer-events:none}
#ov{position:absolute;inset:0;background:var(--panel);display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;white-space:pre-line;font-weight:800;font-size:clamp(24px,6vmin,48px)}
#ov button{position:static;width:min(60vw,300px);height:70px;background:#1a9933}
#hint{left:0;right:0;bottom:calc(120px + env(safe-area-inset-bottom,0px));text-align:center;font-size:clamp(10px,2.2vmin,15px);opacity:.6}
</style></head><body>
<div id="g"><canvas id="c"></canvas><div id="fl"></div>
<div class="t" id="sc"></div><div class="t" id="am"></div><div class="t" id="wv"></div><div class="t" id="st"></div>
<button id="en" title="Click to change weather"></button>
<div class="t" id="hint">Drag to look around · Space = fire · R = reload · tap the weather label to change it</div>
<div id="hb"><div id="hf"></div><div id="ht"></div></div>
<button class="b" id="rel">RELOAD</button><button class="b" id="hunt">HUNT</button><button class="b" id="fire">FIRE</button>
<div id="ov"><div id="ot"></div><button class="b" id="rs">RESTART</button></div></div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d');
let W,H,F;
function rs(){const d=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);F=H*.9}
addEventListener('resize',rs);rs();
const lsG=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsS=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let st='ready',yaw=0,pitch=0,ammo=12,score=0,hp=100,wave=0,mons=[],T=0,cdT=0,relT=0,flash=0,mz=0,hm=0,wi=0,best=+lsG('de_best')||0,wv={mode:'idle',left:0,t:0};
const WE=[['Clear',1,0],['Cloudy',1.05,.15],['Rain',1.15,.25],['Fog',1.25,.4],['Storm',1.35,.5]];
const rnd=(a,b)=>a+Math.random()*(b-a),mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t),rgb=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
// scenery
const B=[...Array(46)].map(()=>({a:rnd(0,6.283),d:rnd(18,42),w:rnd(2,6),h:rnd(4,15),s:rnd(.6,1),l:[rnd(.1,.9),rnd(.1,.9),rnd(.1,.9)]}));
const S=[...Array(70)].map(()=>({a:rnd(0,6.283),e:rnd(.05,1.2)}));
// ---- environment (same rules as EnvironmentController) ----
const win=(h,s,e)=>{s=(s%24+24)%24;e=(e%24+24)%24;return s<=e?h>=s&&h<e:h>=s||h<e};
function env(){const d=new Date(),h=d.getHours()+d.getMinutes()/60,sr=6,ss=18;let n,b,m;
 if(win(h,sr-1,sr+1)){n='Dawn';b=.45;m=1.15}else if(win(h,ss-1,ss+1)){n='Dusk';b=.35;m=1.5}else if(win(h,sr+1,ss-1)){n='Day';b=1;m=.8}else{n='Night';b=0;m=1.8}
 const w=WE[wi];b*=[1,.78,.62,.7,.42][wi];return{n,b,m:m*w[1],w:w[0],f:w[2]}}
// ---- projection ----
function P(wx,wy,wz){const cy=wy-1.3,cx=wx*Math.cos(yaw)-wz*Math.sin(yaw),z0=wx*Math.sin(yaw)+wz*Math.cos(yaw);
 const y2=cy*Math.cos(pitch)-z0*Math.sin(pitch),cz=cy*Math.sin(pitch)+z0*Math.cos(pitch);
 return cz<.15?null:[W/2+cx/cz*F,H/2-y2/cz*F,cz]}
// ---- audio (procedural, like Sfx.cs) ----
let ac;const SN={shot:[.15,520,90,.55,.45],hit:[.1,300,160,.35,.55],hurt:[.25,140,60,.3,.7],kill:[.3,200,700,.1,.5],rel:[.12,900,500,.05,.4]};
function snd(k){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
 const[d,f0,f1,nz,v]=SN[k],r=ac.sampleRate,n=r*d|0,b=ac.createBuffer(1,n,r),a=b.getChannelData(0);let ph=0;
 for(let i=0;i<n;i++){const t=i/n;ph+=6.283*(f0+(f1-f0)*t)/r;a[i]=(Math.sin(ph)*(1-nz)+(Math.random()*2-1)*nz)*(1-t)*(1-t)*v}
 const s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start()}catch(e){}}
// ---- HUD ----
const say=t=>$('st').textContent=t;
function hud(){$('sc').textContent='Score: '+score+(best?'  (best '+best+')':'');$('am').textContent='Ammo: '+ammo+'/12';$('wv').textContent='Wave: '+wave;
 $('hf').style.width=Math.max(0,hp)+'%';$('ht').textContent='HP '+Math.max(0,hp);const e=env();$('en').textContent=e.n+' | '+e.w}
// ---- game ----
const alive=()=>mons.filter(m=>!m.dy).length;
function spawn(){const a=yaw+rnd(-.7,.7),d=rnd(3,5.5),w=wave;
 mons.push({x:Math.sin(a)*d,z:Math.cos(a)*d,hp:100*(1+.15*(w-1)),mx:100*(1+.15*(w-1)),sp:.7*Math.min(2,1+.08*(w-1)),dmg:10+2*(w-1),na:T+1000,fl:0,pu:0,dy:0});say('Monster spotted! Aim and fire.')}
function fire(){if(st!=='play'||T<cdT||relT)return;if(ammo<=0){say('Out of ammo. Reload!');return}
 ammo--;cdT=T+250;mz=T+80;snd('shot');let bm=null,bz=1e9;
 for(const m of mons){if(m.dy)continue;const p=P(m.x,.6,m.z);if(!p)continue;const r=.525*F/p[2],hh=.75*F/p[2];
  if(Math.abs(W/2-p[0])<r&&Math.abs(H/2-p[1])<hh&&p[2]<bz){bz=p[2];bm=m}}
 if(bm){bm.hp-=25;bm.fl=T+80;hm=T+150;if(bm.hp<=0){bm.dy=.3;score+=100;ammo=Math.min(12,ammo+2);snd('kill');say('Monster down! +100')}else snd('hit')}
 hud()}
function reload(){if(st!=='play'||relT||ammo>=12)return;relT=T+1000;snd('rel');say('Reloading...')}
function hurt(d){hp-=d;flash=.6;snd('hurt');navigator.vibrate&&navigator.vibrate(120);if(hp<=0){hp=0;over()}hud()}
function over(){st='over';if(score>best){best=score;lsS('de_best',best)}$('ot').textContent='GAME OVER\nScore: '+score+'\nReached wave '+wave+'\nBest: '+best;$('ov').style.display='flex'}
function start(){if(st==='play')return;ammo=12;score=0;hp=100;wave=0;mons=[];relT=0;st='play';wv={mode:'pre',left:0,t:T+1000};$('ov').style.display='none';$('hunt').style.display='none';say('The hunt begins!');hud()}
function update(dt){
 if(relT&&T>=relT){relT=0;ammo=12;say('Reloaded.');hud()}
 if(st!=='play')return;
 for(const m of mons){
  if(m.dy){m.dy-=dt/1000;continue}
  const d=Math.hypot(m.x,m.z);
  if(d>1.1){m.x-=m.x/d*m.sp*dt/1000;m.z-=m.z/d*m.sp*dt/1000}
  else if(T>=m.na){m.na=T+1400;m.pu=.18;hurt(m.dmg)}
  if(m.pu>0)m.pu-=dt/1000}
 mons=mons.filter(m=>!m.dy||m.dy>0);
 if(wv.mode==='pre'&&T>=wv.t){wave++;wv.left=1+wave;wv.mode='spawn';wv.t=T;say('Wave '+wave+' incoming!');hud()}
 else if(wv.mode==='spawn'){if(wv.left>0){if(T>=wv.t&&alive()<3){spawn();wv.left--;wv.t=T+3000/Math.max(.3,env().m)}}else wv.mode='clear'}
 else if(wv.mode==='clear'&&alive()===0){say('Wave '+wave+' cleared!');wv.mode='pre';wv.t=T+4000}
 if(flash>0){flash-=dt/1000*1.5;$('fl').style.opacity=Math.max(0,flash)}}
// ---- drawing ----
function draw(){const e=env(),b=e.b,sh=mix([5,7,15],[111,168,220],b),sl=mix([15,21,48],[207,227,245],b),hy=H/2+Math.tan(pitch)*F;
 let g=x.createLinearGradient(0,hy-H*1.2,0,hy);g.addColorStop(0,rgb(sh));g.addColorStop(1,rgb(sl));x.fillStyle=g;x.fillRect(0,0,W,Math.max(0,hy));
 const gc=mix([12,16,14],[70,90,64],b);g=x.createLinearGradient(0,hy,0,hy+H);g.addColorStop(0,rgb(mix(gc,sl,.35)));g.addColorStop(1,rgb(gc));x.fillStyle=g;x.fillRect(0,Math.max(0,hy),W,H);
 if(b<.6){x.fillStyle='#fff';for(const s of S){const p=P(Math.sin(s.a)*Math.cos(s.e)*100,1.3+Math.sin(s.e)*100,Math.cos(s.a)*Math.cos(s.e)*100);if(p){x.globalAlpha=(.6-b)*1.3;x.fillRect(p[0],p[1],2,2)}}x.globalAlpha=1}
 // ground grid
 x.strokeStyle='rgba(255,255,255,.07)';x.lineWidth=1;x.beginPath();
 for(let k=-30;k<=30;k+=3){let on=false;for(let z=-30;z<=30;z+=2){const p=P(k,0,z);if(p){on?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]);on=true}else on=false}
  on=false;for(let z=-30;z<=30;z+=2){const p=P(z,0,k);if(p){on?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]);on=true}else on=false}}
 x.stroke();
 // buildings
 for(const o of B){const cx=Math.sin(o.a)*o.d,cz=Math.cos(o.a)*o.d,tx=Math.cos(o.a)*o.w/2,tz=-Math.sin(o.a)*o.w/2;
  const l=P(cx-tx,0,cz-tz),r=P(cx+tx,0,cz+tz),t=P(cx,o.h,cz);if(!l||!r||!t)continue;
  x.fillStyle=rgb(mix(mix([20,22,30],[90,92,100],b),sl,Math.min(.6,o.d/80)).map(v=>v*o.s));
  const x0=Math.min(l[0],r[0]),w=Math.abs(r[0]-l[0]);x.fillRect(x0,t[1],w,l[1]-t[1]);
  if(b<.5){x.fillStyle='rgba(255,220,120,.8)';for(const q of o.l)x.fillRect(x0+q*w*.8,t[1]+(l[1]-t[1])*q,w*.08,w*.08)}}
 // monsters
 const ms=mons.map(m=>({m,p:P(m.x,0,m.z),h:P(m.x,1.2,m.z)})).filter(o=>o.p&&o.h).sort((a,c)=>c.p[2]-a.p[2]);
 for(const{m,p,h}of ms){const sc=m.dy?Math.max(0,m.dy/.3):1,pu=1+.3*Math.sin(Math.max(0,m.pu)/.18*Math.PI),k=F/p[2]*sc*pu,H2=(p[1]-h[1])*sc*pu,w=.75*k,cx=p[0],fy=p[1];
  x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(cx,fy,w*.7,w*.18,0,0,6.283);x.fill();
  x.fillStyle=m.fl>T?'#fff':rgb(mix([140,20,26],[60,6,10],.35*(1-m.hp/m.mx)));x.beginPath();x.roundRect(cx-w/2,fy-H2,w,H2,w/2);x.fill();
  x.fillStyle='#ffe633';x.shadowColor='#ffd400';x.shadowBlur=10;for(const s of[-1,1]){x.beginPath();x.arc(cx+s*.14*k,fy-H2*.7,.07*k,0,6.283);x.fill()}x.shadowBlur=0;
  const bw=.84*F/p[2]*sc,by=fy-H2-.18*F/p[2]*sc;x.fillStyle='#111';x.fillRect(cx-bw/2,by,bw,bw*.12);x.fillStyle='#33e641';x.fillRect(cx-bw/2,by,bw*Math.max(0,m.hp/m.mx),bw*.12)}
 if(e.f>0){x.fillStyle=`rgba(120,130,140,${e.f})`;x.fillRect(0,0,W,H)}
 if(mz>T){g=x.createRadialGradient(W/2,H,0,W/2,H,H*.6);g.addColorStop(0,'rgba(255,230,150,.7)');g.addColorStop(1,'rgba(255,230,150,0)');x.fillStyle=g;x.fillRect(0,0,W,H)}
 x.strokeStyle=hm>T?'#ff3030':'rgba(255,255,255,.85)';x.lineWidth=3;x.beginPath();x.moveTo(W/2-28,H/2);x.lineTo(W/2+28,H/2);x.moveTo(W/2,H/2-28);x.lineTo(W/2,H/2+28);x.stroke()}
// ---- input ----
let dr=null;
$('g').addEventListener('pointerdown',ev=>{if(ev.target.closest('button'))return;dr={x:ev.clientX,y:ev.clientY}});
addEventListener('pointermove',ev=>{if(!dr)return;yaw-=(ev.clientX-dr.x)*.005;pitch=Math.max(-.9,Math.min(.9,pitch+(ev.clientY-dr.y)*.005));dr={x:ev.clientX,y:ev.clientY}});
addEventListener('pointerup',()=>dr=null);
const bind=(i,f)=>$(i).addEventListener('pointerdown',ev=>{ev.preventDefault();ev.stopPropagation();f()});
bind('fire',fire);bind('rel',reload);bind('hunt',start);bind('rs',start);
$('en').addEventListener('click',()=>{wi=(wi+1)%WE.length;hud()});
addEventListener('keydown',ev=>{if(ev.code==='Space'){ev.preventDefault();fire()}else if(ev.code==='KeyR')reload();else if(ev.code==='Enter'&&st!=='play')start();
 else if(ev.code==='ArrowLeft')yaw-=.08;else if(ev.code==='ArrowRight')yaw+=.08;else if(ev.code==='ArrowUp')pitch=Math.min(.9,pitch+.05);else if(ev.code==='ArrowDown')pitch=Math.max(-.9,pitch-.05)});
// ---- loop ----
let last=performance.now();say('Ready. Press HUNT to begin!');hud();
(function loop(n){const dt=Math.min(50,n-last);last=n;T+=dt;update(dt);draw();requestAnimationFrame(loop)})(last);
setInterval(hud,1000);
</script></body></html>
